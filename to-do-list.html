<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="stylesheet" href="to-do-list.css">
</head>
<body>
<div class="todo-container">
    <h3>To Do List</h3>
    
    <div class="input-row">
      <input type="text" placeholder="To Do Name" class="toDoName">
      <input type="date" class="toDoDate"> 
      <button onclick="addtodo();" class="add-button">Add Task</button>
    </div>

    <div class="displayToDo"></div>
  </div>
  <script src="to-do-list.js"></script>
</body>
</html>
